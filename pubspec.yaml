publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  record: 5.1.2
  record_android: 1.3.0
  path: ^1.9.0
  path_provider: ^2.1.3
  http: ^1.2.2
  shared_preferences: ^2.2.3
  share_plus: ^9.0.0
  intl: ^0.19.0
  permission_handler: ^11.3.1
  flutter_markdown: ^0.7.3
  pdf: ^3.10.8
  archive: ^3.6.1

dependency_overrides:
  record_platform_interface: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
